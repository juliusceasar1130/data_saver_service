    alert("当前配置数据点位总数: " + params.filter(item => item).length);

    // ========== WebSocket心跳保活参数 ==========
    // 心跳包数据：用于维持WebSocket连接的活跃状态
    let liveParam = {
        type: "info",      // 消息类型：信息类型
        info: "alive"      // 消息内容：保活信号
    };
    
    // 将心跳参数转换为JSON字符串，便于传输
    liveParam = JSON.stringify(liveParam);

    // 将所有数据点位参数转换为JSON字符串格式
    for (let i = 0; i < params.length; i++) {

            params[i] = JSON.stringify(params[i]);
            console.log("数据点位 " + i + ": ", params[i]);  // 调试输出
        }
    }
    
    /* ==================== WebSocket事件处理器 ==================== */
    
    /**
     * WebSocket连接成功事件处理器
     * 当WebSocket连接建立成功时触发
     */
    Socket.onopen = function () {
        console.log("WebSocket连接已建立...");
        
        // 保存参数数组到当前上下文
        this.params = params;
        
        // 批量发送所有数据点位订阅请求
        for (let i = 0; i < params.length; i++) {
            if (params[i]) {  // 确保参数有效
                Socket.send(this.params[i]);
                console.log("发送订阅请求:", this.params[i]);
            }
        }
        
        console.log("所有数据点位订阅请求已发送完成");
    };

    /**
     * WebSocket消息接收事件处理器
     * 当收到服务器推送的数据时触发
     * @param {MessageEvent} evt - 包含接收到的数据
     */
    Socket.onmessage = function (evt) {
        console.log("收到WebSocket数据:", evt.data);
        
        try {
            // 解析接收到的JSON数据
            var object = JSON.parse(evt.data);
            
            // 将数据转发到后端API进行存储或处理
            axios.post("/ws", object)
                .then(response => {
                    console.log("数据转发成功:", response.data);
                })
                .catch(error => {
                    console.error("数据转发失败:", error);
                });
                
        } catch (error) {
            console.error("数据解析失败:", error);
        }
    };

    /**
     * WebSocket连接关闭事件处理器
     * 当WebSocket连接断开时触发
     * @param {CloseEvent} evt - 包含关闭的详细信息
     */
    Socket.onclose = function (evt) {
        // 弹出警告提示用户连接已断开
        window.alert("WebSocket连接已断开！请检查网络连接或联系管理员。");
        console.log("WebSocket连接已关闭，原因:", evt.reason);
        
        // 确保连接完全关闭
        Socket.close();
    };

    /**
     * WebSocket错误事件处理器
     * 当WebSocket发生错误时触发
     * @param {Event} evt - 错误事件对象
     */
    Socket.onerror = function (evt) {
        console.error("WebSocket发生错误:", evt);
        // 可以在这里添加错误恢复逻辑，如重连机制
    };

    /* ==================== WebSocket心跳保活机制 ==================== */
    
    // 心跳计数器：用于控制心跳发送和连接检查的节奏
    var heartbeatCounter = 0;
    
    /**
     * 定时器：每2秒执行一次心跳检查和保活
     * 作用：
     * 1. 维持WebSocket连接活跃状态
     * 2. 定期检查连接状态
     * 3. 可选择性地重新发送订阅请求
     */
    setInterval(function () {
        
        // 偶数次心跳：发送保活信号
        if (heartbeatCounter % 2 == 0) {
            
            // 检查WebSocket连接状态
            if (Socket.readyState === WebSocket.OPEN) {
                // 连接正常，发送心跳包
                Socket.send(liveParam);
                console.log("发送心跳保活信号:", heartbeatCounter);
                
                // 可选：在特定条件下重新发送订阅请求（当前已注释）
                // Socket.onopen;
                // this.params = params;
                // for (let i = 0; i < params.length; i++) {
                //     Socket.send(this.params[i]);
                // }
                
            } else {
                console.warn("WebSocket连接状态异常，无法发送心跳:", Socket.readyState);
            }
            
        } else {
            // 奇数次心跳：记录日志，进行其他检查
            console.log("心跳周期:", heartbeatCounter);
            // 可以在这里添加连接质量检查等逻辑
        }
        
        // 递增心跳计数器
        heartbeatCounter++;
        
    }, 2000);  // 2000毫秒 = 2秒间隔

    // 可选的连接超时关闭（当前已注释）
    // setTimeout(() => { Socket.close(); }, 3000);  // 3秒后关闭连接（仅用于测试）

</script>
