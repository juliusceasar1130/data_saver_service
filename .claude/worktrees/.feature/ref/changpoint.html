.js"></script><script src="./element-ui/lib/index.js"></script><script type="text/javascript" src="./js/jquery-1.11.0.min.js"></script><script src="./js/axios-0.18.0.js"></script><script>    var vue = new Vue({        el: '#app',        data: {            pagination: {},            dataList: [],//当前页要展示的列表数据            formData: {},//表单数据            dialogFormVisible: false,//控制表单是否可见            dialogFormVisible4Edit: false,//编辑表单是否可见            rules: {//校验规则                type: [{required: true, message: '类别为必填项', trigger: 'blur'}],                name: [{required: true, message: '名称为必填项', trigger: 'blur'}]            }        },        //钩子函数，VUE对象初始化完成后自动执行        created() {            // this.getAll();        },        methods: {            //列表            getAll() {                axios.get("/changpoint").then((res) => {                    this.dataList = res.data.data                })            },            //弹出添加窗口            handleCreate() {                this.dialogFormVisible = true;                this.resetForm();            },            //重置表单            resetForm() {                this.formData = {};            },            //添加            handleAdd() {                axios.post("/changpoint", this.formData).then((res) => {                    if (res.data.code == 20011) {                        this.dialogFormVisible = false;                        this.$message.success("添加成功")                    } else if (res.data.code == 20010) {                        this.$message.error("添加失敗")                    } else {                        this.$message.error(res.data.msg)                    }                }).finally(() => {                    this.getAll();                });            },            //弹出编辑窗口            handleUpdate(row) {                axios.get("/changpoint/" + row.id).then((res) => {                    if (res.data.code == 20041) {                        this.formData = res.data.data;                        this.dialogFormVisible4Edit = true;                    } else {                        this.$message.error(res.data.msg)                    }                })            },            //编辑            handleEdit() {                axios.put("/changpoint", this.formData).then((res) => {                    if (res.data.code == 20031) {                        this.dialogFormVisible4Edit = false;                        this.$message.success("修改成功")                    } else if (res.data.code == 20030) {                        this.$message.error("修改失敗")                    } else {                        this.$message.error(res.data.msg)                    }                }).finally(() => {                    this.getAll();                });            },            // 删除            handleDelete(row) {                this.$confirm("此操作将永久删除数据，是否继续", "提示", {type: 'info'}).then(() => {                    axios.delete("/changpoint/" + row.id).then((res) => {                        if (res.data.code == 20021) {                            this.$message.error("删除成功")                        } else {                            this.$message.error("删除失败")                        }                    }).finally(() => {                        this.getAll();                    });                }).catch(() => {                    this.$message.info("删除取消")                })            }        }    })</script></html>
