services:
  # 注意：该docker文件在172.22.44.99服务器（docker desktop版本4.43.2）可以启动采集数据，但是在编程器中运行websocket服务器连接失败。可能和desktop的版本有关。
  # PostgreSQL 数据库服务 (集成自 docker-compose_postgresql.yml)
  postgres:
    image: postgres:17-alpine
    container_name: 120JPH_postgres
    restart: unless-stopped
    # 显式加入网络
    networks:
      - app-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-rollerbed_tracking_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 数据持久化
      - pgdata:/var/lib/postgresql/data
      # 自动初始化数据库表结构 (非常重要！)
      - ./create_tables_postgresql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-rollerbed_tracking_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python 采集websocket数据保存到postgresql服务(目前访问宿主机的网络存在问题，不使用)
  data-saver-service:
    build: .
    image: data-saver-service:v3
    container_name: data_saver_service_v3.1
    restart: unless-stopped
    init: true # 解决 Python 进程可能不响应信号的问题
    # 显式加入网络
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy # 等待数据库健康检查通过后再启动

    # 环境变量配置
    environment:
      # 数据库配置
      # 自动连接到同网络下的 postgres 服务
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-root}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-root}
      - DB_NAME=${POSTGRES_DB:-rollerbed_tracking_db}

      # WebSocket 配置
      - WS_SERVER_HOST=${WS_SERVER_HOST:-172.21.12.73}
      - WS_SERVER_PORT=${WS_SERVER_PORT:-8088}
      - WS_SERVER_PATH=${WS_SERVER_PATH:-/ws/emosweb}

      # 其他配置
      - LOG_LEVEL=INFO
      - DEVICE_CONFIG_PATH=/app/deviceConfig.json

    # 文件挂载
    volumes:
      # 挂载配置文件，允许主机修改
      - ./deviceConfig.json:/app/deviceConfig.json:ro

  # defect_db 缺陷汇总增量刷新任务，无法解决访问宿主机所在的其他网络，不适用docker部署。
  # 修改时间：2026-04-13 18:05 Asia/Shanghai
  # 主要修改内容：
  # 1. 新增独立 defect-refresh 服务，用于一次性执行刷新脚本
  # 2. 供 Windows 任务计划程序通过 docker compose --profile manual run --rm 定时触发
  defect-refresh:
    build:
      context: .
      dockerfile: Dockerfile.defect-refresh
    image: defect-refresh:latest
    profiles:
      - manual
    init: true
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 容器内访问 compose 中的 postgres 服务时，应使用服务名而不是 localhost
      DEFECT_TARGET_DB_HOST: ${DEFECT_TARGET_DB_HOST_IN_DOCKER:-postgres}
      DEFECT_TARGET_DB_PORT: ${DEFECT_TARGET_DB_PORT_IN_DOCKER:-5432}
    command: ["--print-status"]

volumes:
  pgdata:
    driver: local

# 定义自定义网络
networks:
  app-network:
    driver: bridge
