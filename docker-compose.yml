services:
  # 注意：该docker文件在172.22.44.99服务器（docker desktop版本4.43.2）可以启动采集数据，但是在编程器中运行websocket服务器连接失败。可能和desktop的版本有关。
  # PostgreSQL 数据库服务 (集成自 docker-compose_postgresql.yml)
  postgres:
    image: postgres:17-alpine
    container_name: 120JPH_postgres
    restart: unless-stopped
    # 显式加入网络
    networks:
      - app-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-rollerbed_tracking_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 数据持久化
      - pgdata:/var/lib/postgresql/data
      # 自动初始化数据库表结构 (非常重要！)
      - ./create_tables_postgresql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-rollerbed_tracking_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python 采集websocket数据保存到postgresql服务(目前访问宿主机的网络存在问题，不使用)
  data-saver-service:
    build: .
    image: data-saver-service:v3.2
    container_name: data_saver_service_v3.2
    restart: unless-stopped
    init: true # 解决 Python 进程可能不响应信号的问题
    # 显式加入网络
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy # 等待数据库健康检查通过后再启动

    # 环境变量配置
    environment:
      # 数据库配置
      # 自动连接到同网络下的 postgres 服务
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-root}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-root}
      - DB_NAME=${POSTGRES_DB:-rollerbed_tracking_db}

      # WebSocket 配置
      - WS_SERVER_HOST=${WS_SERVER_HOST:-host.docker.internal}
      - WS_SERVER_PORT=${WS_SERVER_PORT:-8082}
      - WS_SERVER_PATH=${WS_SERVER_PATH:-/ws/emosweb}
      - WS_USE_PORT_IN_URL=${WS_USE_PORT_IN_URL:-true}

      # 其他配置
      - LOG_LEVEL=INFO
      - DEVICE_CONFIG_PATH=/app/deviceConfig.json

    # 文件挂载
    volumes:
      # 挂载配置文件，允许主机修改
      - ./deviceConfig.json:/app/deviceConfig.json:ro

  # 自动化定时数据同步与分析数仓刷新调度服务 (Added: 2026-05-17)
  refresh-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    image: refresh-scheduler:v1.0
    container_name: refresh_scheduler_v1.0
    restart: always
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - CARBODY_TARGET_DB_HOST=postgres
      - CARBODY_TARGET_DB_PORT=5432
      - CARBODY_TARGET_DB_NAME=analytics_db
      - CARBODY_TARGET_DB_USER=root
      - CARBODY_TARGET_DB_PASSWORD=root
      - CARBODY_SOURCE_DB_HOST=host.docker.internal
      - CARBODY_SOURCE_DB_PORT=14330
      - CARBODY_SOURCE_DB_NAME=DXQcontrol_SVWMEB_BI_DWH
      - CARBODY_SOURCE_DB_USER=svw
      - CARBODY_SOURCE_DB_PASSWORD=svw_pwd
      - DEFECT_TARGET_DB_HOST=postgres
      - DEFECT_TARGET_DB_PORT=5432
      - DEFECT_TARGET_DB_NAME=defect_db
      - DEFECT_TARGET_DB_USER=root
      - DEFECT_TARGET_DB_PASSWORD=root
      - DEFECT_SOURCE_DB_HOST=host.docker.internal
      - DEFECT_SOURCE_DB_PORT=14331
      - DEFECT_SOURCE_DB_NAME=DENTCHECK
      - DEFECT_SOURCE_DB_USER=sa
      - DEFECT_SOURCE_DB_PASSWORD=
      - DEFECT_SOURCE_DB_TYPE=sqlserver
      - DEFECT_SOURCE_DB_SCHEMA=dbo
      - SCHEDULER_INTERVAL_MINUTES=${SCHEDULER_INTERVAL_MINUTES:-3}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "find /tmp/scheduler_health -mmin -$$(($${SCHEDULER_INTERVAL_MINUTES:-3} + 2)) | grep -q .",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    driver: local

# 定义自定义网络
networks:
  app-network:
    driver: bridge
